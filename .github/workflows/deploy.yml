name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # the weekly figures job calls this after committing a new week: a push made
  # with GITHUB_TOKEN deliberately does not trigger `push` above, so without
  # this the new week would sit in the repo and never reach the site
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes one still queued
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the month arithmetic is where bugs hide — never ship a red build
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
